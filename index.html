<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>DragTime</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
*{ box-sizing:border-box; }

body{
  font-family:Arial, sans-serif;
  background:#f4f6fa;
  margin:0;
  padding:20px;
  display:flex;
  gap:20px;
}

/* ✅ 모바일 오른쪽 여백 보정 */
@media (max-width: 768px){
  body{
    padding-left:20px;
    padding-right:20px;
  }

  #captureArea{
    padding-right:20px;
  }
}

#captureArea{
  display:flex;
  gap:20px;
  align-items:flex-start;
}

#leftPanel,
#rightPanel{
  display:flex;
  flex-direction:column;
  align-items:stretch;
}

#rightPanel{
  width:280px;
}

#plannerHeader{
  background:white;
  border:1px solid #ccc;
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.03);
  display:flex;
  align-items:center;
}

#plannerTitle{
  width:100%;
  border:none;
  outline:none;
  font-size:18px;
  font-weight:600;
  background:transparent;
}

#grid{
  display:grid;
  grid-template-columns:90px repeat(12,20px);
  border:1px solid #ccc;
  background:white;
  border-radius:10px;
  overflow:hidden;
  touch-action: none;
}

/* 일정목록 */
#side{
  width:100%;
  background:white;
  border:1px solid #ccc;
  border-radius:10px;
  padding:10px;
  height: auto;
  overflow: visible;
  margin-bottom:10px;
}

#side h3{text-align:center;}

.side-item{
  display:flex;
  align-items:flex-start;
  gap:8px;
  border:1px solid #ddd;
  border-radius:6px;
  padding:6px;
  padding-right:80px;
  margin-bottom:6px;
  font-size:12px;
  position:relative;
  overflow:hidden;
}

.side-item .text-box{
  flex:1;
  min-width:0;
  max-width:100%;
  word-break:break-word;
  overflow-wrap:break-word;
  white-space:normal;
}

.delete-btn{
  position:absolute;
  top:6px;
  border:none;
  color:white;
  border-radius:4px;
  font-size:10px;
  cursor:pointer;
  padding:2px 6px;
}

.color-box{width:16px;height:16px;border-radius:4px;}

.time{
  height:40px;width:90px;background:#f1f3f6;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  box-shadow: inset -1px 0 0 #ddd, inset 0 -1px 0 #ddd;
}

.cell{
  height:40px;
  width:20px;
  cursor:pointer;
  box-shadow: inset -1px 0 0 #eee, inset 0 -1px 0 #eee;
}

.cell.v-strong{
  box-shadow: inset -1px 0 0 #cfcfcf, inset 0 -1px 0 #eee;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal-box{
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
  max-width:90%;
}

.modal-box input,
.modal-box textarea,
.modal-box select{
  width:100%;
  box-sizing:border-box;
  font-size:16px;
}

#colorInput{
  width:60px;
  height:36px;
  padding:0;
  border:none;
  background:none;
}

#addFromSide{
  width:100%;
  margin-bottom:10px;
  padding:6px;
  border:none;
  border-radius:6px;
  background:#3f8cff;
  color:white;
  cursor:pointer;
}

/* 📸 저장 버튼 */
#captureBtn{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#111;
  color:white;
  cursor:pointer;
  font-size:13px;
  margin-bottom:8px;
}

/* 🗑 초기화 버튼 */
#resetBtn{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#ff5c5c;
  color:white;
  cursor:pointer;
  font-size:13px;
}

.drag-preview{background: rgba(63,140,255,0.3);}
</style>
</head>

<body>

<div id="captureArea">

  <!-- 좌측 -->
  <div id="leftPanel">
    <div id="plannerHeader">
      <input id="plannerTitle">
    </div>
    <div id="grid"></div>
  </div>

  <!-- 우측 -->
  <div id="rightPanel">

    <div id="side">
      <h3>📌 일정 목록</h3>
      <button id="addFromSide">📋 일정 추가</button>
      <div id="list"></div>
    </div>

    <!-- 📸 화면 저장 버튼 -->
    <button id="captureBtn">📸 화면 저장</button>

    <!-- 🗑 전체 초기화 버튼 -->
    <button id="resetBtn">🗑 전체 초기화</button>

  </div>

</div>

<!-- 모달 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">일정 입력</h3>
    <input id="titleInput" placeholder="제목"><br><br>
    <textarea id="detailInput" placeholder="세부내용"></textarea><br><br>
    <label>시작</label><select id="editStart"></select><br><br>
    <label>종료</label><select id="editEnd"></select><br><br>
    <input type="color" id="colorInput"><br><br>
    <button id="save">저장</button>
    <button id="cancel">취소</button>
  </div>
</div>

<script>
/* ===== localStorage 키 ===== */
const STORAGE_KEY = "dragtime_data_v1";

/* ===== 전체 초기화 ===== */
function resetAll(){
  if(confirm("⚠ 모든 일정, 제목, 색상, 저장데이터가 삭제됩니다.\n완전히 초기화할까요?")){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

/* ===== 랜덤 색 ===== */
function getRandomColor(){
  const colors = [
    "#3f8cff","#ff7675","#55efc4","#ffeaa7",
    "#a29bfe","#fd79a8","#fab1a0","#81ecec",
    "#74b9ff","#00b894","#fdcb6e","#e17055"
  ];
  return colors[Math.floor(Math.random()*colors.length)];
}

/* ===== 제목 자동 생성 ===== */
const plannerTitleInput = document.getElementById("plannerTitle");
const today = new Date();
const yy = String(today.getFullYear()).slice(2);
const mm = String(today.getMonth()+1).padStart(2,"0");
const dd = String(today.getDate()).padStart(2,"0");
plannerTitleInput.value = `📆Drag Time ${yy}${mm}${dd}`;
plannerTitleInput.addEventListener("input", saveAll);

/* ===== 요소 ===== */
const grid=document.getElementById("grid");
const listBox=document.getElementById("list");
const modal=document.getElementById("modal");
const modalTitle=document.getElementById("modalTitle");
const saveBtn=document.getElementById("save");
const cancelBtn=document.getElementById("cancel");
const resetBtn=document.getElementById("resetBtn");
const captureBtn=document.getElementById("captureBtn");

resetBtn.onclick = resetAll;

const titleInput=document.getElementById("titleInput");
const detailInput=document.getElementById("detailInput");
const colorInput=document.getElementById("colorInput");
const editStart=document.getElementById("editStart");
const editEnd=document.getElementById("editEnd");

const addFromSideBtn=document.getElementById("addFromSide");

let editingItem=null;
let isEditMode=false;
let backupData=null;

let isDragging = false;
let dragStartIndex = null;
let dragEndIndex = null;

const times=[];
for(let i=7;i<27;i++){
  let h=i%24;
  for(let j=0;j<12;j++){
    times.push(String(h).padStart(2,"0")+":"+String(j*5).padStart(2,"0"));
  }
}

[times].forEach(arr=>{
  arr.forEach(t=>{
    [editStart,editEnd].forEach(sel=>{
      const o=document.createElement("option");
      o.value=t;o.innerText=t;
      sel.appendChild(o.cloneNode(true));
    });
  });
});

function clearDragPreview(){
  document.querySelectorAll(".cell.drag-preview").forEach(c=>c.classList.remove("drag-preview"));
}

function paintDragPreview(s,e){
  clearDragPreview();
  for(let i=s;i<=e;i++){
    const c=document.querySelector(`.cell[data-index='${i}']`);
    if(c) c.classList.add("drag-preview");
  }
}

let cellIndex=0;
for(let r=0;r<20;r++){
  const timeCell=document.createElement("div");
  timeCell.className="time";
  timeCell.innerText=times[r*12];
  grid.appendChild(timeCell);

  for(let c=0;c<12;c++){
    const cell=document.createElement("div");
    cell.className="cell";
    cell.dataset.index=cellIndex;

    if((cellIndex+1)%2===0 && (cellIndex+1)%12!==0){
      cell.classList.add("v-strong");
    }

    cell.addEventListener("pointerdown", e=>{
      isDragging = true;
      dragStartIndex = Number(cell.dataset.index);
      dragEndIndex = dragStartIndex;
      paintDragPreview(dragStartIndex, dragEndIndex);
    });

    grid.appendChild(cell);
    cellIndex++;
  }
}

document.addEventListener("pointermove", e=>{
  if(!isDragging) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if(!el || !el.classList.contains("cell")) return;
  const idx = Number(el.dataset.index);
  dragEndIndex = idx;
  let s = Math.min(dragStartIndex, dragEndIndex);
  let e2 = Math.max(dragStartIndex, dragEndIndex);
  paintDragPreview(s, e2);
});

document.addEventListener("pointerup", ()=>{
  if(!isDragging) return;
  isDragging = false;
  clearDragPreview();

  let s = Math.min(dragStartIndex, dragEndIndex);
  let e = Math.max(dragStartIndex, dragEndIndex) + 1;

  modalTitle.innerText="일정 추가";
  isEditMode=false;

  titleInput.value="";
  detailInput.value="";
  colorInput.value = getRandomColor();

  editStart.value=times[s];
  editEnd.value=times[e] || times[times.length-1];

  modal.style.display="flex";
});

function clearCells(s,e){
  for(let i=s;i<e;i++){
    const c=document.querySelector(`.cell[data-index='${i}']`);
    if(c) c.style.background="";
  }
}

function paintCells(s,e,color){
  for(let i=s;i<e;i++){
    const c=document.querySelector(`.cell[data-index='${i}']`);
    if(c) c.style.background=color;
  }
}

function sortSideList(){
  const items = Array.from(document.querySelectorAll(".side-item"));
  items.sort((a,b)=> Number(a.dataset.start) - Number(b.dataset.start));
  items.forEach(item => listBox.appendChild(item));
}

/* ===== localStorage 저장 ===== */
function saveAll(){
  const items = [];
  document.querySelectorAll(".side-item").forEach(item=>{
    items.push({
      title:item.dataset.title,
      detail:item.dataset.detail,
      color:item.dataset.color,
      s:Number(item.dataset.start),
      e:Number(item.dataset.end)
    });
  });

  const data = {
    title: plannerTitleInput.value,
    items
  };

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* ===== localStorage 불러오기 ===== */
function loadAll(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  const data = JSON.parse(raw);

  if(data.title){
    plannerTitleInput.value = data.title;
  }

  if(Array.isArray(data.items)){
    data.items.forEach(it=>{
      paintCells(it.s,it.e,it.color);
      createSideItem(it.title,it.detail,it.color,it.s,it.e,false);
    });
  }
}

function createSideItem(title,detail,color,sIdx,eIdx,save=true){
  const item=document.createElement("div");
  item.className="side-item";
  item.dataset.start=sIdx;
  item.dataset.end=eIdx;
  item.dataset.title=title;
  item.dataset.detail=detail;
  item.dataset.color=color;

  const colorBox=document.createElement("div");
  colorBox.className="color-box";
  colorBox.style.background=color;

  const text=document.createElement("div");
  text.className="text-box";
  text.innerHTML=`<b>${title}</b><br><small>${detail}</small><br><small>⏰ ${times[sIdx]} ~ ${times[eIdx]}</small>`;

  const editBtn=document.createElement("button");
  editBtn.className="delete-btn";
  editBtn.style.right="42px";
  editBtn.style.background="#4caf50";
  editBtn.innerText="수정";

  editBtn.onclick=()=>{
    isEditMode=true;
    editingItem=item;

    backupData = {
      s: Number(item.dataset.start),
      e: Number(item.dataset.end),
      color: item.dataset.color
    };

    modalTitle.innerText="일정 수정";

    titleInput.value=item.dataset.title;
    detailInput.value=item.dataset.detail;
    colorInput.value=item.dataset.color;
    editStart.value=times[item.dataset.start];
    editEnd.value=times[item.dataset.end];

    clearCells(item.dataset.start,item.dataset.end);
    modal.style.display="flex";
  };

  const del=document.createElement("button");
  del.className="delete-btn";
  del.style.right="6px";
  del.style.background="#ff5c5c";
  del.innerText="삭제";

  del.onclick=()=>{
    clearCells(Number(item.dataset.start), Number(item.dataset.end));
    item.remove();
    saveAll();
  };

  item.append(colorBox,text,editBtn,del);
  listBox.appendChild(item);
  sortSideList();
  if(save) saveAll();
}

saveBtn.onclick=()=>{
  const title=titleInput.value.trim();
  const detail=detailInput.value.trim();
  const color=colorInput.value;
  const sIdx=times.indexOf(editStart.value);
  const eIdx=times.indexOf(editEnd.value);

  if(eIdx <= sIdx){ alert("⚠ 종료 시간은 시작 시간보다 늦어야 합니다!"); return; }
  if(title === ""){ alert("⚠ 제목을 입력해주세요!"); return; }

  if(isEditMode && editingItem){ editingItem.remove(); }

  paintCells(sIdx,eIdx,color);
  createSideItem(title,detail,color,sIdx,eIdx,true);

  modal.style.display="none";
  isEditMode=false;
  editingItem=null;
  backupData=null;
};

cancelBtn.onclick=()=>{
  if(isEditMode && backupData){
    paintCells(backupData.s, backupData.e, backupData.color);
  }

  modal.style.display="none";
  isEditMode=false;
  editingItem=null;
  backupData=null;
};

addFromSideBtn.onclick=()=>{
  isEditMode=false;
  modalTitle.innerText="일정 추가";
  titleInput.value="";
  detailInput.value="";
  colorInput.value = getRandomColor();
  editStart.value=times[0];
  editEnd.value=times[1];
  modal.style.display="flex";
};

/* 📸 저장 기능 (초기화 버튼 숨김 추가됨) */
captureBtn.onclick = ()=>{
  const target = document.getElementById("captureArea");

  const btns = document.querySelectorAll(".delete-btn");
  btns.forEach(b=>b.style.display="none");

  const addBtn = document.getElementById("addFromSide");
  addBtn.style.display = "none";

  captureBtn.style.display = "none";
  resetBtn.style.display = "none";   // ✅ 초기화 버튼 숨김

  const wrapper = document.createElement("div");
  wrapper.style.padding = "40px";
  wrapper.style.background = "#f4f6fa";
  wrapper.style.display = "inline-block";

  const parent = target.parentNode;
  const nextSibling = target.nextSibling;

  parent.removeChild(target);
  wrapper.appendChild(target);
  parent.insertBefore(wrapper, nextSibling);

  html2canvas(wrapper, { scale: 2 }).then(canvas=>{
    const link = document.createElement("a");
    link.download = "time_planner.jpeg";
    link.href = canvas.toDataURL("image/jpeg", 0.95);
    link.click();

    parent.removeChild(wrapper);
    parent.insertBefore(target, nextSibling);

    btns.forEach(b=>b.style.display="block");
    addBtn.style.display = "block";
    captureBtn.style.display = "block";
    resetBtn.style.display = "block"; // ✅ 초기화 버튼 복원
  });
};

/* ===== 초기 로드 ===== */
loadAll();
</script>
</body>
</html>
